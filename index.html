
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prepositions Animated Poster Game</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#fff6df;
    font-family:"Comic Sans MS","Arial Rounded MT Bold",Arial,sans-serif;
    color:#1f2a44;
  }
  .poster{
    width:min(1180px,96vw);
    margin:0 auto; height:100vh; display:flex; flex-direction:column; justify-content:center;
    background:#fffdf2;
    border:8px solid #fff;
    border-radius:28px;
    box-shadow:0 16px 35px rgba(0,0,0,.16);
    overflow:hidden;
  }
  header{
    text-align:center;
    padding:16px 16px 12px;
    background:#fffdf2;
    position:relative;
  }
  h1{
    margin:0;
    font-size:clamp(32px,5vw,64px);
    letter-spacing:2px;
    color:#ff7b00;
    text-shadow:3px 3px 0 #fff, 7px 7px 0 rgba(45,156,219,.18);
  }
  .sub{
    display:inline-block;
    background:#2176d2;
    color:white;
    padding:10px 30px;
    border-radius:999px;
    font-size:clamp(20px,3vw,34px);
    font-weight:900;
    margin-top:8px;
  }

  .titleWrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .titleIcon{
    width:144px;
    height:144px;
    object-fit:contain;
  }

  .catL,.catR{
    position:absolute;
    top:26px;
    font-size:78px;
  }
  .catL{left:18px}.catR{right:18px}
  .row{
    display:grid;
    grid-template-columns:170px repeat(6, 1fr);
    border-top:4px solid var(--line);
    background:var(--tint);
    min-height:130px;
  }
  .rowTitle{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:24px;
    font-weight:900;
    padding:12px;
    color:var(--title);
    border-right:3px dashed rgba(0,0,0,.18);
    line-height:1.18;
  }
  .card{
    position:relative;
    background:#fffdf7;
    min-height:130px;
    border-right:2px dashed rgba(0,0,0,.18);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:12px 6px 8px;
    cursor:pointer;
    overflow:hidden;
    user-select:none;
  }
  .card:last-child{border-right:0}
  .word{
    font-size:23px;
    font-weight:900;
    margin-bottom:8px;
    color:#111;
    min-height:30px;
    text-align:center;
  }
  .scene{
    position:relative;
    width:126px;
    height:88px;
  }
  .ball{
    position:absolute;
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 12px 9px,#fff 0 5px,#ff4d4d 6px,#c91414 75%);
    border:3px solid #a20d0d;
    z-index:4;
  }
  .box{
    position:absolute;
    width:62px;height:44px;
    background:#75b9e8;
    border:3px solid #2b6d9d;
    border-radius:6px;
    box-shadow:inset -8px -8px 0 rgba(0,0,0,.08);
    z-index:2;
  }
  .box:before{
    content:"";
    position:absolute;
    left:-3px;top:-16px;
    width:62px;height:18px;
    background:#9cd8ff;
    border:3px solid #2b6d9d;
    border-radius:6px;
  }
  .table{
    position:absolute;width:80px;height:12px;background:#5d8fbc;border:3px solid #2b587e;top:34px;left:24px;border-radius:5px;
  }
  .table:before,.table:after{
    content:"";position:absolute;top:9px;width:8px;height:42px;background:#5d8fbc;border:3px solid #2b587e;
  }
  .table:before{left:8px}.table:after{right:8px}
  .wall{
    position:absolute;width:48px;height:58px;background:#6c9ac4;border:3px solid #2b587e;border-radius:6px;z-index:3;
  }
  .wall.tall{height:74px}
  .bar{
    position:absolute;width:90px;height:12px;background:#75b9e8;border:3px solid #2b6d9d;border-radius:6px;
  }
  .road{
    position:absolute;width:100px;height:34px;background:#555;left:12px;top:48px;border-radius:20px;transform:skewX(-12deg);
  }
  .road:after{content:"";position:absolute;left:10px;right:10px;top:13px;border-top:4px dashed #fff}
  .pet,.emoji{
    position:absolute;font-size:38px;z-index:5;line-height:1;
  }
  .smallball{width:24px;height:24px}
  .star{position:absolute;font-size:28px;z-index:3}
  .circleDots .ball{width:20px;height:20px}
  .arrow{
    position:absolute;font-size:30px;font-weight:900;color:#222;z-index:6;
  }
  .rainbow{position:absolute;font-size:58px;left:32px;top:20px}
  .target{position:absolute;font-size:30px}
  .label{
    position:absolute;
    left:6px;bottom:4px;
    background:#fff;
    color:#2176d2;
    border:2px solid #bde8ff;
    border-radius:999px;
    padding:2px 8px;
    font-size:13px;
    font-weight:900;
    opacity:0;
    transition:.2s;
  }
  .card:hover .label{opacity:1}
  footer{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    background:#e9fff9;
    border-top:4px solid #78dcca;
    font-size:22px;
    font-weight:900;
  }
  button{
    border:0;
    background:#26384f;
    color:#fff;
    font:inherit;
    border-radius:16px;
    padding:12px 18px;
    cursor:pointer;
  }

  /* animations */
  .play[data-prep="in"] .move{animation:inBox .9s ease-in-out}
  @keyframes inBox{50%{transform:translateY(35px) scale(.75)}100%{transform:translateY(0)}}

  .play[data-prep="on"] .move{animation:onTop .9s ease-in-out}
  @keyframes onTop{50%{transform:translateY(-18px)}100%{transform:translateY(0)}}

  .play[data-prep="at"] .move{animation:atPulse .8s ease-in-out}
  @keyframes atPulse{50%{transform:scale(1.25);filter:drop-shadow(0 0 10px #ff4747)}}

  .play[data-prep="near"] .move{animation:nearMove .9s ease-in-out}
  @keyframes nearMove{50%{transform:translateX(-24px)}100%{transform:translateX(0)}}

  .play[data-prep="under"] .move{animation:underMove .9s ease-in-out}
  @keyframes underMove{50%{transform:translateY(18px)}100%{transform:translateY(0)}}

  .play[data-prep="over"] .move{animation:overArc .95s ease-in-out}
  @keyframes overArc{50%{transform:translate(22px,-36px)}100%{transform:translate(48px,0)}}

  .play[data-prep="below"] .move{animation:belowBounce .8s ease-in-out}
  @keyframes belowBounce{50%{transform:translateY(14px)}100%{transform:translateY(0)}}

  .play[data-prep="above"] .move{animation:aboveBounce .8s ease-in-out}
  @keyframes aboveBounce{50%{transform:translateY(-22px)}100%{transform:translateY(0)}}

  .play[data-prep="around"] .move{animation:aroundSpin 1.1s ease-in-out}
  @keyframes aroundSpin{to{transform:rotate(360deg)}}

  .play[data-prep="through"] .move{animation:throughMove 1s ease-in-out}
  @keyframes throughMove{50%{transform:translateX(52px);opacity:.45}100%{transform:translateX(0);opacity:1}}

  .play[data-prep="among"] .move{animation:amongWiggle .9s ease-in-out}
  @keyframes amongWiggle{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,-5px)}80%{transform:translate(5px,5px)}}

  .play[data-prep="between"] .move{animation:betweenMove .9s ease-in-out}
  @keyframes betweenMove{50%{transform:translateX(0) scale(1.18)}}

  .play[data-prep="behind"] .move{animation:hideBehind .9s ease-in-out}
  @keyframes hideBehind{50%{transform:translateY(36px);opacity:.38}100%{transform:translateY(0);opacity:1}}

  .play[data-prep="front"] .move{animation:frontPop .9s ease-in-out}
  @keyframes frontPop{50%{transform:translateY(-10px) scale(1.22)}}
  .play[data-prep="along"] .along-arrow{animation:alongRoad 1s ease-in-out}
  .along-arrow{
    transform:rotate(10deg);
    transform-origin:center center;
  }
  @keyframes alongRoad{
    0%{transform:rotate(10deg) translateY(0)}
    50%{transform:rotate(10deg) translateY(44px)}
    100%{transform:rotate(10deg) translateY(0)}
  }

  .play[data-prep="across"] .across-arrow{
    animation:acrossMove 1s ease forwards;
  }
  @keyframes acrossMove{
    0%{transform:translateX(0)}
    100%{transform:translateX(60px)}
  }



  .play[data-prep="up"] .move{animation:goUp .9s ease-in-out}
  @keyframes goUp{50%{transform:translate(28px,-38px)}100%{transform:translate(0)}}

  .play[data-prep="down"] .move{animation:goDown .9s ease-in-out}
  @keyframes goDown{50%{transform:translate(28px,32px)}100%{transform:translate(0)}}

  .play[data-prep="opposite"] .move{animation:oppositeMove .9s ease-in-out}
  @keyframes oppositeMove{50%{transform:translateX(-26px)}}
  .play[data-prep="opposite"] .opposite-left{animation:oppositeLeft 1s ease-in-out}
  .play[data-prep="opposite"] .opposite-right{animation:oppositeRight 1s ease-in-out}
  @keyframes oppositeLeft{0%{transform:translateX(0)}50%{transform:translateX(-24px)}100%{transform:translateX(0)}}
  @keyframes oppositeRight{0%{transform:scaleX(-1) translateX(0)}50%{transform:scaleX(-1) translateX(-24px)}100%{transform:scaleX(-1) translateX(0)}}

  .play[data-prep="onto"] .move{animation:ontoMove .9s ease-in-out}
  @keyframes ontoMove{50%{transform:translate(8px,-30px)}}

  .play[data-prep="off"] .move{animation:offMove .9s ease-in-out}
  @keyframes offMove{50%{transform:translate(45px,32px)}}

  .play[data-prep="into"] .move{animation:intoMove .9s ease-in-out}
  @keyframes intoMove{50%{transform:translate(40px,10px) scale(.8)}}

  .play[data-prep="out"] .move{animation:outMove .9s ease-in-out}
  @keyframes outMove{50%{transform:translate(50px,-16px)}}

  .play[data-prep="past"] .move{animation:pastMove 1s ease-in-out}
  @keyframes pastMove{50%{transform:translateX(70px)}100%{transform:translateX(0)}}

  .play[data-prep="beside"] .move{animation:besideMove .9s ease-in-out}
  @keyframes besideMove{50%{transform:translateX(-18px)}}

  .play[data-prep="against"] .move{animation:againstBump .8s ease-in-out}
  @keyframes againstBump{45%{transform:translateX(16px)}55%{transform:translateX(9px)}}

  .play[data-prep="fromto"] .fromto-ball{
  animation:fromToMove 1s ease forwards;
}

@keyframes fromToMove{
  0%   { transform:translateX(0); }
  100% { transform:translateX(82px); }
}

  .play[data-prep="towards"] .towards-dog{
  animation:towardsMove 1s ease forwards;
}

@keyframes towardsMove{
  0%   { transform:translateX(0); }
  100% { transform:translateX(72px); }
}

  @media(max-width:850px){
    .row{grid-template-columns:110px repeat(3,1fr)}
    .rowTitle{font-size:18px}
  
  .titleWrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .titleIcon{
    width:216px;
    height:216px;
    object-fit:contain;
  }

  .catL,.catR{display:none}
    footer{font-size:16px;flex-direction:column}
  }
</style>
</head>
<body>
<div class="poster">
  <header>
    
    <div class="titleWrap">
      <img class="titleIcon" src="https://raw.githubusercontent.com/JackChung-Taiwan/preposition/main/image_0.png" alt="Preposition icon">
      <h1>Preposition Animation</h1>
    </div>
    </header>

  <div id="grid"></div>
</div>

<script>
const rows = [
  {title:"PLACE<br>INSIDE &<br>ON TOP", line:"#78c7f2", tint:"#f7fcff", color:"#1167a6", items:[
    ["in/inside","in","in"],["on","on","on"],["at","at","at"],["near","near","near"],["under","under","under"],["over","over","over"]
  ]},
  {title:"PLACE<br>AROUND &<br>BETWEEN", line:"#92d574", tint:"#fbfff5", color:"#247834", items:[
    ["below","below","below"],["above","above","above"],["round/around","around","around"],["through","through","through"],["among","among","among"],["between","between","between"]
  ]},
  {title:"PLACE<br>RELATIVE<br>TO OTHERS", line:"#ffc857", tint:"#fffaf0", color:"#9a6412", items:[
    ["behind","behind","behind"],["in front of","front","in front of"],["along","along","along"],["across","across","across"],["up","up","up"],["down","down","down"]
  ]},
  {title:"DIRECTION<br>& MOVEMENT", line:"#ff9faf", tint:"#fff7f8", color:"#b21d43", items:[
    ["opposite","opposite","opposite"],["onto","onto","onto"],["off","off","off"],["into","into","into"],["out of","out","out of"],["past","past","past"]
  ]},
  {title:"POSITION<br>& RELATION", line:"#b69be8", tint:"#fbf8ff", color:"#56378c", items:[
    ["next to/<br>by/beside","beside","beside"],["against","against","against"],["from---to","fromto","from to"],["towards","towards","towards"]
  ]}
];

function ball(cls="", style=""){return `<div class="ball ${cls}" style="${style}"></div>`}
function box(style=""){return `<div class="box" style="${style}"></div>`}
function wall(style="", tall=false){return `<div class="wall ${tall?'tall':''}" style="${style}"></div>`}
function pet(icon, cls="move", style=""){return `<div class="pet ${cls}" style="${style}">${icon}</div>`}

function sceneFor(prep){
  const b = (s)=>ball("move",s);
  if(prep==="in") return box("left:30px;top:30px")+b("left:44px;top:6px");
  if(prep==="on") return box("left:32px;top:42px")+b("left:46px;top:12px");
  if(prep==="at") return `<div class="table"></div>`+b("left:48px;top:9px");
  if(prep==="near") return box("left:58px;top:35px")+b("left:20px;top:48px");
  if(prep==="under") return `<div class="table"></div>`+b("left:48px;top:55px");
  if(prep==="over") return box("left:38px;top:48px")+b("left:14px;top:48px")+`<div class="arrow" style="left:48px;top:8px">↷</div>`;
  if(prep==="below") return `<div class="bar" style="left:18px;top:24px"></div>`+b("left:48px;top:50px");
  if(prep==="above") return `<div class="bar" style="left:18px;top:56px"></div>`+b("left:48px;top:18px");
  if(prep==="around") return `<div class="star" style="left:48px;top:28px">⭐</div><div class="circleDots move" style="position:absolute;left:18px;top:8px;width:90px;height:74px">${[0,1,2,3,4,5,6,7].map((i)=>ball("",`left:${45+36*Math.cos(i*.785)}px;top:${34+28*Math.sin(i*.785)}px;width:20px;height:20px`)).join("")}</div>`;
  if(prep==="through") return box("left:32px;top:28px")+b("left:10px;top:38px")+`<div class="arrow" style="left:45px;top:35px">→</div>`;
  if(prep==="among") return [ [10,12,'#1976d2'],[50,8,'#1976d2'],[92,18,'#1976d2'],[18,62,'#1976d2'],[58,44,'#d22'],[96,62,'#1976d2']].map((p,i)=>ball(i===4?"move":"",`left:${p[0]}px;top:${p[1]}px;background:${p[2]}`)).join("");
  if(prep==="between") return wall("left:18px;top:20px",true)+wall("right:18px;top:20px",true)+b("left:46px;top:43px");
  if(prep==="behind") return pet("🐱","move","left:38px;top:4px;z-index:2")+wall("left:36px;top:42px",true);
  if(prep==="front") return wall("left:54px;top:23px",true)+pet("🐱","move","left:18px;top:48px;z-index:5");
  if(prep==="along") return `
    <div style="position:absolute;left:18px;top:8px;width:92px;height:72px;border-radius:50%;background:#18e88a;border:3px solid #0bb86a;overflow:hidden">
      <div style="position:absolute;left:20px;top:-10px;width:6px;height:100px;background:#111;transform:rotate(10deg)"></div>
      <div style="position:absolute;left:48px;top:-10px;width:6px;height:100px;background:#111;transform:rotate(10deg)"></div>
      <div style="position:absolute;left:72px;top:-10px;width:4px;height:100px;opacity:.45;transform:rotate(10deg);border-left:4px dashed #111;background:transparent"></div>
      <div class="arrow move along-arrow" style="left:35px;top:4px;font-size:34px;color:#fff;text-shadow:2px 2px 0 #0b6b43">↓</div>
    </div>
  `;
  if(prep==="across") return `
    <div style="position:absolute;left:18px;top:8px;width:92px;height:72px;border-radius:50%;background:#fff;border:3px solid #b7ead9;overflow:hidden">
      <div style="position:absolute;left:35px;top:-10px;width:6px;height:100px;background:#111;transform:rotate(10deg)"></div>
      <div style="position:absolute;left:64px;top:-10px;width:6px;height:100px;background:#111;transform:rotate(10deg)"></div>
      <div class="arrow move across-arrow" style="left:10px;top:20px;font-size:34px;color:#333">→</div>
    </div>
  `;
  if(prep==="up") return `<div class="stairs" style="position:absolute;right:10px;bottom:4px;width:90px;height:76px;background:linear-gradient(to top right, transparent 0 49%, #d9a15f 50% 100%)"></div>`+pet("🐱","move","left:28px;top:44px");
  if(prep==="down") return `<div class="stairs" style="position:absolute;right:10px;bottom:4px;width:90px;height:76px;background:linear-gradient(to top right, transparent 0 49%, #d9a15f 50% 100%)"></div>`+pet("🐱","move","left:54px;top:8px");
  if(prep==="opposite") return `<div class="emoji move opposite-left" style="left:4px;top:34px">🚗</div><div class="emoji move opposite-right" style="right:4px;top:34px;transform:scaleX(-1)">🚙</div><div class="arrow" style="left:0px;top:62px">←</div><div class="arrow" style="right:0px;top:62px">→</div>`;
  if(prep==="onto") return box("left:44px;top:44px")+pet("🐶","move","left:14px;top:14px");
  if(prep==="off") return box("left:30px;top:30px")+pet("🐶","move","left:42px;top:2px");
  if(prep==="into") return box("left:28px;top:34px")+pet("🐶","move","left:10px;top:22px");
  if(prep==="out") return box("left:28px;top:34px")+pet("🐶","move","left:42px;top:32px");
  if(prep==="past") return `<div class="wall" style="left:60px;top:24px;width:20px;height:66px;border-radius:999px"></div>`+pet("🐶","move","left:10px;top:40px");
  if(prep==="beside") return `<div class="emoji" style="left:20px;top:28px">🪴</div><div class="emoji move" style="left:62px;top:40px">🐶</div>`;
  if(prep==="against") return wall("left:68px;top:14px",true)+pet("🐶","move","left:28px;top:42px");
  if(prep==="fromto") return `
    <div style="position:absolute;left:16px;top:18px;font-size:22px;font-weight:900;color:#111">A</div>
    <div style="position:absolute;right:16px;top:18px;font-size:22px;font-weight:900;color:#111">B</div>
    <div class="ball move fromto-ball" style="left:10px;top:48px"></div>
  `;
  if(prep==="towards") return `<div class="target" style="right:10px;top:42px">🚩</div>`+pet("🐶","move towards-dog","left:8px;top:42px")+`<div class="arrow" style="left:52px;top:48px">→</div>`;
  return "";
}

const grid = document.getElementById("grid");
rows.forEach(row=>{
  const div=document.createElement("div");
  div.className="row";
  div.style.setProperty("--line",row.line);
  div.style.setProperty("--tint",row.tint);
  div.style.setProperty("--title",row.color);
  div.innerHTML=`<div class="rowTitle">${row.title}</div>` + row.items.map(([label,prep,say])=>`
    <div class="card" data-prep="${prep}" data-say="${say}" onclick="playCard(this)">
      <div class="word">${label}</div>
      <div class="scene">${sceneFor(prep)}</div>
      <div class="label">click: ${say}</div>
    </div>
  `).join("");
  grid.appendChild(div);
});


const voiceBases = [
  "https://jackchung-taiwan.github.io/preposition/",
  "https://jackchung-taiwan.github.io/preposition/voice/"
];

const voiceMap = {
  "in": "in.mp3",
  "on": "on.mp3",
  "at": "at.mp3",
  "near": "near.mp3",
  "under": "under.mp3",
  "over": "over.mp3",
  "below": "below.mp3",
  "above": "above.mp3",
  "round/around": "around.mp3",
  "around": "around.mp3",
  "through": "through.mp3",
  "among": "among.mp3",
  "between": "between.mp3",
  "behind": "behind.mp3",
  "in front of": "in_front_of.mp3",
  "along": "along.mp3",
  "across": "across.mp3",
  "up": "up.mp3",
  "down": "down.mp3",
  "opposite": "opposite.mp3",
  "onto": "onto.mp3",
  "off": "off.mp3",
  "into": "into.mp3",
  "out of": "out_of.mp3",
  "past": "past.mp3",
  "next to/by/beside": "beside.mp3",
  "beside": "beside.mp3",
  "against": "against.mp3",
  "from to": "from_to.mp3",
  "towards": "towards.mp3"
};

let currentAudio = null;

function playVoice(word){
  const file = voiceMap[word];
  if(!file){
    console.log("No audio mapping for:", word);
    return;
  }

  if(currentAudio){
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  let index = 0;

  function tryPlay(){
    const url = voiceBases[index] + file;
    currentAudio = new Audio(url);
    currentAudio.volume = 1;

    currentAudio.onerror = () => {
      index++;
      if(index < voiceBases.length){
        tryPlay();
      }else{
        console.log("Audio file not found:", file);
      }
    };

    currentAudio.play().catch(err => {
      console.log("Audio play blocked or failed:", url, err);
    });
  }

  tryPlay();
}

function playCard(card){
  card.classList.remove("play");
  void card.offsetWidth;
  card.classList.add("play");

  const say = card.dataset.say;
  playVoice(say);

  setTimeout(()=>card.classList.remove("play"),1150);
}

</script>
